<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel · Painéis da EPT/RN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <div id="topo"></div>

  <main id="conteudo">
    <section class="painel-abertura">
      <span class="bolha-coral" style="position:absolute; right:-140px; top:-160px; width:380px; height:380px; background:var(--coral); border-radius:46% 54% 60% 40% / 50% 45% 55% 50%;" aria-hidden="true"></span>
      <div class="conteiner">
        <nav class="trilha" aria-label="Você está em"><a href="index.html#paineis">Painéis</a> › <span id="trilha-titulo"></span></nav>
        <h1 class="etiqueta" id="titulo"></h1>
        <p id="resumo"></p>
        <a class="botao amarelo" id="tela-cheia" target="_blank" rel="noopener" hidden>Abrir em tela cheia ↗</a>
      </div>
    </section>

    <div class="conteiner quadro-envolve">
      <div class="quadro" id="quadro"></div>
    </div>

    <div class="conteiner">
      <div class="detalhes fim-pagina">
        <div class="caixa">
          <h2>Páginas deste painel</h2>
          <ol id="paginas"></ol>
        </div>
        <div class="caixa">
          <h2>Fonte e atualização</h2>
          <p id="fonte"></p>
        </div>
      </div>
    </div>
  </main>

  <footer class="rodape" id="rodape"></footer>

  <script src="js/paineis.js"></script>
  <script src="js/site.js"></script>
  <script>Site.iniciar("painel");</script>
</body>
</html>
