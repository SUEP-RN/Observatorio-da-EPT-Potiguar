<!doctype html>

<body>

        </span>
        <span class="marca-texto">Painéis da EPT/RN<small>SUEP · SEEC/RN</small></span>

      <nav class="menu" aria-label="Principal">

  <footer class="rodape">
    <div class="conteiner">

      <a href="index.html">Voltar para todos os painéis</a>
